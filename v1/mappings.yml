# ------------------------------------------------------------------ #
# GitLab Migration — project and user mappings
#
# Schema (validated on load by gitlab_migration.py):
#
#   source:
#     path:        str  — browser URL of the source project (note links)
#     project_id:  int  — numeric project ID used in API paths
#     name:        str  — human label, reporting only
#   destination:
#     path / project_id / name — same shape as source
#   users:
#     <source_username>:
#       dest_username: str  — username on the destination instance
#       pat_env:       str  — env var holding that user's PAT
#
# Every user listed here must hold Owner on the destination project for
# the migration window: setting iid and created_at requires owner rights.
#
# Listing a user here is a commitment: --sanity-check FAILS if that user's
# pat_env is unset, still a <...> placeholder, or does not hold Owner. Remove
# the entry if you do not have their PAT.
#
# A source author absent from this map is migrated with DEST_GITLAB_TOKEN
# plus a markdown attribution header and recorded as
# fidelity=admin_attributed. That is the intended fallback.
# ------------------------------------------------------------------ #

source:
